<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deniel's Team — Attendance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0d0f1a;--surface:#13162a;--surface2:#1a1e35;--card:#161929;
  --border:#252a45;--border2:#2e3555;
  --accent:#7c6dfa;--accent2:#a78bfa;--accent-glow:rgba(124,109,250,0.18);
  --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#38bdf8;--pink:#f472b6;
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:15px;min-height:100vh;}

/* HEADER */
header{background:linear-gradient(135deg,#13162a,#0d0f1a);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
header h1{font-size:16px;font-weight:600;}
.hdr-actions{margin-left:auto;display:flex;gap:8px;}

/* NAV */
.nav{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 24px;overflow-x:auto;}
.nav::-webkit-scrollbar{height:2px;}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'Sarabun',sans-serif;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--muted2);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);}

/* PAGE */
.page{display:none;padding:20px 24px;max-width:1100px;}
.page.active{display:block;}

/* BUTTONS */
.btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Sarabun',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(124,109,250,.3);}
.btn-primary:hover{background:#8b7efb;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:var(--red);}
.btn-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:var(--green);}
.btn-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--yellow);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:5px;}

/* FORM ELEMENTS */
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 13px;color:var(--text);font-size:14px;font-family:'Sarabun',sans-serif;outline:none;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
label.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:5px;}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.b-attend{background:rgba(34,197,94,.12);color:var(--green);}
.b-late{background:rgba(245,158,11,.12);color:var(--yellow);}
.b-absent{background:rgba(239,68,68,.12);color:var(--red);}
.b-cam-on{background:rgba(56,189,248,.12);color:var(--blue);}
.b-cam-off{background:rgba(100,116,139,.12);color:var(--muted2);}
.b-purple{background:rgba(124,109,250,.12);color:var(--accent2);}
.b-none{background:var(--surface2);color:var(--muted);border:1px dashed var(--border2);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.stat-val{font-size:24px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.c-g{color:var(--green);} .c-y{color:var(--yellow);} .c-r{color:var(--red);} .c-b{color:var(--blue);} .c-p{color:var(--accent2);}

/* TABLE */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid rgba(37,42,69,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(124,109,250,.04);}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translateY(70px);opacity:0;transition:all .3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.err{border-color:var(--red);color:var(--red);}
.toast.warn{border-color:var(--yellow);color:var(--yellow);}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-ico{font-size:34px;margin-bottom:10px;opacity:.3;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}

/* MTG COLORS */
.mt-begin-online{color:#818cf8;} .mt-bridge-online{color:#34d399;}
.mt-center-bkk{color:#fb923c;} .mt-center-korat{color:#f472b6;} .mt-begin-onsite{color:#facc15;}

/* ===================== CHECK-IN PAGE ===================== */
.checkin-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
.mtg-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px;}
.mtg-btn{background:var(--surface2);border:1.5px solid var(--border2);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;transition:all .2s;font-family:'Sarabun',sans-serif;}
.mtg-btn:hover{border-color:var(--accent);background:rgba(124,109,250,.06);}
.mtg-btn.selected{border-color:var(--accent);background:rgba(124,109,250,.1);box-shadow:0 0 0 1px var(--accent);}
.mtg-btn .mb-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.mtg-btn .mb-sub{font-size:11px;color:var(--muted);}
.mtg-btn .mb-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

.date-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.date-row input{flex:0 0 auto;}

/* CHECK-IN LIST */
.checkin-list{display:flex;flex-direction:column;gap:8px;}
.checkin-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;transition:border-color .2s;}
.checkin-row.status-attend{border-left:3px solid var(--green);}
.checkin-row.status-late{border-left:3px solid var(--yellow);}
.checkin-row.status-absent{border-left:3px solid var(--red);}
.checkin-row.status-none{border-left:3px solid var(--border2);}
.cr-name{font-size:15px;font-weight:600;min-width:80px;}
.cr-line{font-size:11px;color:var(--muted);}
.cr-actions{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.status-btns{display:flex;gap:5px;}
.cam-btns{display:flex;gap:5px;}
.note-input{width:160px;padding:5px 10px;font-size:12px;border-radius:6px;}

.checkin-summary-bar{display:flex;gap:16px;padding:12px 18px;background:var(--surface2);border-radius:8px;margin-bottom:16px;flex-wrap:wrap;}
.csb-item{font-size:13px;display:flex;align-items:center;gap:6px;}

/* ===================== SUMMARY PAGE ===================== */
.filter-bar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filter-bar .fg{margin-bottom:0;}

.seg-tabs{display:flex;gap:0;border:1px solid var(--border2);border-radius:8px;overflow:hidden;margin-bottom:18px;}
.seg-tab{padding:7px 16px;font-size:12px;font-weight:600;background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .2s;}
.seg-tab.active{background:var(--accent);color:#fff;}

/* per-member-per-meeting table */
.mtg-tbl{width:100%;border-collapse:collapse;}
.mtg-tbl th,.mtg-tbl td{padding:8px 12px;border:1px solid var(--border);font-size:12px;text-align:center;}
.mtg-tbl th{background:var(--surface2);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.mtg-tbl td:first-child{text-align:left;font-weight:600;min-width:90px;}
.cell-g{color:var(--green);font-weight:700;} .cell-y{color:var(--yellow);font-weight:700;} .cell-r{color:var(--red);font-weight:700;} .cell-na{color:var(--border2);}

/* MEMBERS PAGE */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.member-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
.mc-name{font-size:15px;font-weight:600;margin-bottom:2px;}
.mc-sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
.mc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.mc-actions{display:flex;gap:6px;}

/* ORG */
.org-wrap{overflow-x:auto;padding:20px 0;}
.org-node{background:var(--surface2);border:1.5px solid var(--border2);border-radius:10px;padding:10px 16px;text-align:center;min-width:110px;}
.org-node.root-node{border-color:var(--accent);background:rgba(124,109,250,.1);}
.org-node .nn{font-weight:600;font-size:13px;}
.org-node .ns{font-size:10px;color:var(--muted);margin-top:2px;}
.org-connector-v{width:1px;height:20px;background:var(--border2);margin:0 auto;}
.org-children-wrap{display:flex;gap:20px;align-items:flex-start;position:relative;padding-top:0;}
.org-children-wrap::before{content:'';position:absolute;top:0;left:calc(55px);right:calc(55px);height:1px;background:var(--border2);}
.org-child{display:flex;flex-direction:column;align-items:center;}
.org-child::before{content:'';width:1px;height:14px;background:var(--border2);}

@media(max-width:600px){
  .page{padding:12px;}
  header{padding:12px 14px;}
  .mtg-selector{grid-template-columns:1fr 1fr;}
  .cr-actions{width:100%;}
  .note-input{width:120px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">👥</div>
  <h1>Deniel's Team</h1>
  <div class="hdr-actions">
    <button class="btn btn-success btn-sm" onclick="loadMockData()">🎲 Mock</button>
    <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑</button>
  </div>
</header>

<div class="nav">
  <button class="tab active" onclick="gotoTab('checkin',this)">✅ เช็คชื่อ</button>
  <button class="tab" onclick="gotoTab('summary',this)">📊 สรุป</button>
  <button class="tab" onclick="gotoTab('members',this)">👤 สมาชิก</button>
  <button class="tab" onclick="gotoTab('org',this)">🌳 สายงาน</button>
</div>

<!-- ============================================================
     PAGE: CHECK-IN
============================================================ -->
<div class="page active" id="page-checkin">

  <!-- Step 1: Select meeting -->
  <div class="checkin-header">
    <label class="lbl" style="margin-bottom:12px;">① เลือกการประชุม</label>
    <div class="mtg-selector" id="mtg-selector"></div>

    <div class="date-row" id="date-row" style="display:none;">
      <div>
        <label class="lbl">② วันที่</label>
        <input type="date" id="ci-date"/>
      </div>
      <button class="btn btn-primary" onclick="startCheckin()" style="margin-top:18px;">โหลดรายชื่อ →</button>
    </div>
  </div>

  <!-- Step 2: Check-in list -->
  <div id="checkin-section" style="display:none;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div id="ci-session-label" style="font-size:15px;font-weight:600;"></div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="markAll('attend')">✅ เข้าทั้งหมด</button>
        <button class="btn btn-ghost btn-sm" onclick="markAll('absent')">❌ ขาดทั้งหมด</button>
        <button class="btn btn-primary btn-sm" onclick="saveCheckin()">💾 บันทึก</button>
      </div>
    </div>

    <div class="checkin-summary-bar" id="ci-summary-bar"></div>
    <div class="checkin-list" id="checkin-list"></div>
  </div>
</div>

<!-- ============================================================
     PAGE: SUMMARY
============================================================ -->
<div class="page" id="page-summary">

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="fg">
      <label class="lbl">มุมมอง</label>
      <div class="seg-tabs">
        <button class="seg-tab active" onclick="setSumView('month',this)">รายเดือน</button>
        <button class="seg-tab" onclick="setSumView('meeting',this)">ต่อประชุม</button>
        <button class="seg-tab" onclick="setSumView('week',this)">รายสัปดาห์</button>
      </div>
    </div>
    <div class="fg" id="filter-month-wrap">
      <label class="lbl">เดือน</label>
      <select id="f-month"></select>
    </div>
    <div class="fg" id="filter-year-wrap">
      <label class="lbl">ปี</label>
      <select id="f-year"></select>
    </div>
    <div class="fg" id="filter-mtgtype-wrap" style="display:none;">
      <label class="lbl">ประเภทประชุม</label>
      <select id="f-mtgtype" onchange="buildMtgDateSelect();renderSummary()">
        <option value="">ทุกประเภท</option>
        <option value="begin-online">Begin Online</option>
        <option value="bridge-online">Bridge Online</option>
        <option value="center-bkk">Center BKK/KKC</option>
        <option value="center-korat">Center Korat</option>
        <option value="begin-onsite">Begin Onsite</option>
      </select>
    </div>
    <div class="fg" id="filter-mtgdate-wrap" style="display:none;">
      <label class="lbl">วันที่ประชุม</label>
      <select id="f-mtgdate" onchange="renderSummary()">
        <option value="">ทุกวันที่</option>
      </select>
    </div>
    <div class="fg" id="filter-week-wrap" style="display:none;">
      <label class="lbl">สัปดาห์</label>
      <select id="f-week"></select>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="renderSummary()" style="margin-top:18px;">🔄 โหลด</button>
    <button class="btn btn-ghost btn-sm" onclick="exportCSV()" style="margin-top:18px;">⬇ CSV</button>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="sum-stats"></div>

  <!-- Per-member table -->
  <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;">
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;" id="sum-table-title">สรุปรายคน</div>
    <div style="overflow-x:auto;"><table class="mtg-tbl" id="sum-table"></table></div>
  </div>

  <!-- Detail records -->
  <div class="tbl-wrap"><div id="sum-records"></div></div>
</div>

<!-- ============================================================
     PAGE: MEMBERS
============================================================ -->
<div class="page" id="page-members">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
    <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;">สมาชิก</span>
    <button class="btn btn-primary btn-sm" onclick="openMModal()">+ เพิ่มสมาชิก</button>
  </div>
  <div class="member-grid" id="member-grid"></div>
</div>

<!-- ============================================================
     PAGE: ORG
============================================================ -->
<div class="page" id="page-org">
  <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;">แผนภูมิสายงาน</div>
  <div id="org-wrap" class="org-wrap"></div>
</div>

<!-- ============================================================
     MODAL: MEMBER
============================================================ -->
<div class="modal-bg" id="modal-m">
  <div class="modal">
    <h3 id="mmodal-title">เพิ่มสมาชิก</h3>
    <div class="fg"><label class="lbl">ชื่อเล่น</label><input id="m-name" placeholder="เช่น โก้"/></div>
    <div class="fg"><label class="lbl">สายงาน</label><input id="m-line" placeholder="เช่น สาย A"/></div>
    <div class="fg"><label class="lbl">Upline</label><select id="m-upline"></select></div>
    <div class="fg">
      <label class="lbl">ประชุมที่ต้องเข้า</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;" id="m-mtg-checks"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="btn btn-primary" onclick="saveMember()">บันทึก</button>
      <button class="btn btn-ghost" onclick="closeMModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONSTANTS
// ============================================================
const MTG = {
  'begin-online' : {label:'Begin Online',  sub:'ทุกจันทร์ 19:00-21:00',   color:'#818cf8', dot:'#818cf8', online:true},
  'bridge-online': {label:'Bridge Online', sub:'ทุกจันทร์ 19:00-21:00',   color:'#34d399', dot:'#34d399', online:true},
  'center-bkk'   : {label:'Center BKK/KKC',sub:'ทุกศุกร์ 19:00-21:00',   color:'#fb923c', dot:'#fb923c', online:false},
  'center-korat' : {label:'Center Korat',  sub:'ทุกพฤหัส 19:00-21:00',   color:'#f472b6', dot:'#f472b6', online:false},
  'begin-onsite' : {label:'Begin Onsite',  sub:'ทุกอาทิตย์ 13:00-15:00', color:'#facc15', dot:'#facc15', online:false},
};
const MTG_KEYS = Object.keys(MTG);
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// ============================================================
//  STATE
// ============================================================
let members = JSON.parse(localStorage.getItem('dt-members') || '[]');
let records = JSON.parse(localStorage.getItem('dt-records') || '[]');
let ciState = {}; // { memberId: {status, cam, note} }
let selectedMtg = '';
let sumView = 'month'; // month | meeting | week
let editMId = null;

// ============================================================
//  INIT
// ============================================================
document.getElementById('ci-date').value = todayStr();
buildMtgSelector();
buildDateSelects();
renderMembers();

// ============================================================
//  TABS
// ============================================================
function gotoTab(id, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('page-'+id).classList.add('active');
  if(id==='summary') renderSummary();
  if(id==='members') renderMembers();
  if(id==='org')     renderOrg();
}

// ============================================================
//  CHECK-IN PAGE
// ============================================================
function buildMtgSelector() {
  const el = document.getElementById('mtg-selector');
  el.innerHTML = MTG_KEYS.map(k => `
    <button class="mtg-btn" onclick="selectMtg('${k}',this)">
      <div class="mb-label">
        <span class="mb-dot" style="background:${MTG[k].dot}"></span>
        ${MTG[k].label}
      </div>
      <div class="mb-sub">${MTG[k].sub} ${MTG[k].online?'🌐':'📍'}</div>
    </button>
  `).join('');
}

function selectMtg(key, el) {
  selectedMtg = key;
  document.querySelectorAll('.mtg-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('date-row').style.display = 'flex';
  document.getElementById('checkin-section').style.display = 'none';
}

function startCheckin() {
  if(!selectedMtg) return toast('เลือกการประชุมก่อน','err');
  const date = document.getElementById('ci-date').value;
  if(!date) return toast('ระบุวันที่ด้วย','err');

  // Members who must attend this meeting
  const eligible = members.filter(m=>(m.meetings||[]).includes(selectedMtg));
  if(!eligible.length) return toast('ยังไม่มีสมาชิกที่กำหนดประชุมนี้','warn');

  // Pre-fill with existing records for this date+type
  ciState = {};
  eligible.forEach(m => {
    const existing = records.find(r=>r.memberId===m.id && r.type===selectedMtg && r.date===date);
    ciState[m.id] = existing
      ? {status:existing.status, cam:existing.cam||'na', note:existing.note||''}
      : {status:'', cam:'na', note:''};
  });

  // Session label
  const mtg = MTG[selectedMtg];
  document.getElementById('ci-session-label').innerHTML =
    `<span style="color:${mtg.color};font-weight:700;">${mtg.label}</span> &nbsp;·&nbsp; ${fmtDate(date)}`;

  renderCheckinList(eligible, date);
  document.getElementById('checkin-section').style.display = 'block';
}

function renderCheckinList(eligible, date) {
  const isOnline = MTG[selectedMtg].online;
  const list = document.getElementById('checkin-list');

  list.innerHTML = eligible.map(m => {
    const s = ciState[m.id];
    return `
    <div class="checkin-row status-${s.status||'none'}" id="crow-${m.id}">
      <div>
        <div class="cr-name">${m.name}${(() => { const u = members.find(x=>x.id===m.uplineId); return u ? ' <span style="font-size:12px;font-weight:400;color:var(--muted);">('+u.name+')</span>' : ''; })()}</div>
        <div class="cr-line">${m.line||'—'}</div>
      </div>
      <div class="cr-actions">
        <div class="status-btns">
          <button class="btn btn-success btn-xs ${s.status==='attend'?'active-btn':''}" onclick="setCiStatus(${m.id},'attend',this)">✅ เข้า</button>
          <button class="btn btn-warn btn-xs   ${s.status==='late'  ?'active-btn':''}" onclick="setCiStatus(${m.id},'late',this)">⏰ สาย</button>
          <button class="btn btn-danger btn-xs ${s.status==='absent'?'active-btn':''}" onclick="setCiStatus(${m.id},'absent',this)">❌ ขาด</button>
        </div>
        ${isOnline ? `
        <div class="cam-btns">
          <button class="btn btn-ghost btn-xs ${s.cam==='on' ?'active-btn':''}" onclick="setCiCam(${m.id},'on',this)">📹</button>
          <button class="btn btn-ghost btn-xs ${s.cam==='off'?'active-btn':''}" onclick="setCiCam(${m.id},'off',this)">🚫</button>
        </div>` : ''}
        <input class="note-input" type="text" placeholder="หมายเหตุ..."
          value="${s.note}" oninput="ciState[${m.id}].note=this.value"/>
      </div>
    </div>`;
  }).join('');

  updateCiSummary(eligible);
}

function setCiStatus(memberId, status, el) {
  ciState[memberId].status = status;
  const row = document.getElementById('crow-'+memberId);
  row.className = `checkin-row status-${status}`;
  // Update button active state
  row.querySelectorAll('.status-btns .btn').forEach(b=>b.classList.remove('active-btn'));
  el.classList.add('active-btn');
  updateCiSummary(members.filter(m=>(m.meetings||[]).includes(selectedMtg)));
}

function setCiCam(memberId, cam, el) {
  ciState[memberId].cam = cam;
  const row = document.getElementById('crow-'+memberId);
  row.querySelectorAll('.cam-btns .btn').forEach(b=>b.classList.remove('active-btn'));
  el.classList.add('active-btn');
}

function markAll(status) {
  const eligible = members.filter(m=>(m.meetings||[]).includes(selectedMtg));
  eligible.forEach(m=>{ ciState[m.id].status = status; });
  const date = document.getElementById('ci-date').value;
  renderCheckinList(eligible, date);
}

function updateCiSummary(eligible) {
  const vals = eligible.map(m=>ciState[m.id].status);
  const attend = vals.filter(s=>s==='attend').length;
  const late   = vals.filter(s=>s==='late').length;
  const absent = vals.filter(s=>s==='absent').length;
  const pending= vals.filter(s=>!s).length;
  document.getElementById('ci-summary-bar').innerHTML = `
    <div class="csb-item"><span class="badge b-attend">✅ ${attend}</span> เข้าร่วม</div>
    <div class="csb-item"><span class="badge b-late">⏰ ${late}</span> สาย</div>
    <div class="csb-item"><span class="badge b-absent">❌ ${absent}</span> ขาด</div>
    ${pending?`<div class="csb-item"><span class="badge b-none">⬜ ${pending}</span> ยังไม่เช็ค</div>`:''}
    <div class="csb-item" style="margin-left:auto;font-size:12px;color:var(--muted);">รวม ${eligible.length} คน</div>
  `;
}

function saveCheckin() {
  const date = document.getElementById('ci-date').value;
  const eligible = members.filter(m=>(m.meetings||[]).includes(selectedMtg));
  const unchecked = eligible.filter(m=>!ciState[m.id].status);
  if(unchecked.length) {
    if(!confirm(`ยังมี ${unchecked.length} คนที่ยังไม่ได้เช็ค บันทึกต่อเลยไหม?`)) return;
  }

  // Remove old records for this date+type, replace with new
  records = records.filter(r=>!(r.type===selectedMtg && r.date===date &&
    eligible.map(m=>m.id).includes(r.memberId)));

  eligible.forEach(m => {
    const s = ciState[m.id];
    if(!s.status) return; // skip unchecked
    records.unshift({
      id: Date.now() + Math.floor(Math.random()*9999),
      memberId: m.id, memberName: m.name, memberLine: m.line||'',
      type: selectedMtg, date, status: s.status,
      cam: MTG[selectedMtg].online ? s.cam : 'na',
      note: s.note||'', savedAt: new Date().toISOString()
    });
  });
  records.sort((a,b)=>b.date.localeCompare(a.date));
  save();
  toast(`✅ บันทึก ${eligible.filter(m=>ciState[m.id].status).length} คนสำเร็จ!`);
}

function buildDateSelects() {
  const mSel = document.getElementById('f-month');
  const ySel = document.getElementById('f-year');
  if(!mSel||!ySel) return;
  const now = new Date();
  if(!mSel.options.length) {
    TH_MONTHS.forEach((n,i)=>{ const o=document.createElement('option');o.value=i+1;o.textContent=n;mSel.appendChild(o); });
    mSel.value = now.getMonth()+1;
  }
  if(!ySel.options.length) {
    for(let y=now.getFullYear();y>=now.getFullYear()-2;y--){
      const o=document.createElement('option');o.value=y;o.textContent=y;ySel.appendChild(o);
    }
    ySel.value = now.getFullYear();
  }
}

function setSumView(v, el) {
  sumView = v;
  document.querySelectorAll('.seg-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('filter-month-wrap').style.display = (v==='week'||v==='month') ? '' : '';
  document.getElementById('filter-year-wrap').style.display  = '';
  document.getElementById('filter-mtgtype-wrap').style.display  = (v==='meeting') ? '' : 'none';
  document.getElementById('filter-mtgdate-wrap').style.display  = (v==='meeting') ? '' : 'none';
  document.getElementById('filter-week-wrap').style.display     = (v==='week') ? '' : 'none';
  if(v==='week') buildWeekSelect();
  if(v==='meeting') buildMtgDateSelect();
  renderSummary();
}

function buildWeekSelect() {
  const month = +document.getElementById('f-month').value;
  const year  = +document.getElementById('f-year').value;
  const wSel  = document.getElementById('f-week');
  wSel.innerHTML = '';
  // Find all week ranges in the month
  const daysInMonth = new Date(year, month, 0).getDate();
  let wk = 1, d = 1;
  while(d <= daysInMonth) {
    const end = Math.min(d+6, daysInMonth);
    const o = document.createElement('option');
    o.value = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}|${year}-${String(month).padStart(2,'0')}-${String(end).padStart(2,'0')}`;
    o.textContent = `สัปดาห์ที่ ${wk} (${d}–${end} ${TH_MONTHS[month-1]})`;
    wSel.appendChild(o);
    d += 7; wk++;
  }
}

function buildMtgDateSelect() {
  const month  = +document.getElementById('f-month').value;
  const year   = +document.getElementById('f-year').value;
  const fMtg   = document.getElementById('f-mtgtype').value;
  const dSel   = document.getElementById('f-mtgdate');
  const current = dSel.value;

  // Collect unique dates from records matching month/year/type
  const dates = [...new Set(
    records
      .filter(r => {
        const [y,m] = r.date.split('-');
        return +y===year && +m===month && (!fMtg || r.type===fMtg);
      })
      .map(r => r.date)
  )].sort().reverse();

  dSel.innerHTML = '<option value="">ทุกวันที่</option>';
  dates.forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    const [y,mo,dd] = d.split('-');
    o.textContent = dd+'/'+mo+'/'+y;
    dSel.appendChild(o);
  });
  if(current && dates.includes(current)) dSel.value = current;
}

function getFilteredRecords() {
  const month = +document.getElementById('f-month').value;
  const year  = +document.getElementById('f-year').value;

  if(sumView === 'week') {
    const wVal = (document.getElementById('f-week').value||'').split('|');
    if(wVal.length===2) {
      return records.filter(r=>r.date>=wVal[0] && r.date<=wVal[1]);
    }
  }
  if(sumView === 'meeting') {
    const fMtg  = document.getElementById('f-mtgtype').value;
    const fDate = document.getElementById('f-mtgdate').value;
    return records.filter(r=>{
      const [y,m]=r.date.split('-');
      return +y===year && +m===month && (!fMtg||r.type===fMtg) && (!fDate||r.date===fDate);
    });
  }
  // default: month
  return records.filter(r=>{ const [y,m]=r.date.split('-'); return +y===year && +m===month; });
}

function renderSummary() {
  buildDateSelects();
  const data = getFilteredRecords();

  // Stats
  const attend = data.filter(r=>r.status==='attend').length;
  const late   = data.filter(r=>r.status==='late').length;
  const absent = data.filter(r=>r.status==='absent').length;
  document.getElementById('sum-stats').innerHTML = `
    <div class="stat"><div class="stat-lbl">ทั้งหมด</div><div class="stat-val c-p">${data.length}</div></div>
    <div class="stat"><div class="stat-lbl">เข้าร่วม</div><div class="stat-val c-g">${attend}</div></div>
    <div class="stat"><div class="stat-lbl">สาย</div><div class="stat-val c-y">${late}</div></div>
    <div class="stat"><div class="stat-lbl">ขาด</div><div class="stat-val c-r">${absent}</div></div>
    <div class="stat"><div class="stat-lbl">% เข้าร่วม</div><div class="stat-val c-b">${data.length?Math.round((attend/data.length)*100):0}%</div></div>
  `;

  // Per-member × per-meeting table
  const usedMtgs = sumView==='meeting'
    ? (document.getElementById('f-mtgtype').value
        ? [document.getElementById('f-mtgtype').value]
        : MTG_KEYS)
    : MTG_KEYS;

  const rows = members.map(mem => {
    const memData = data.filter(r=>r.memberId===mem.id);
    const cells = usedMtgs.map(mk => {
      if(!(mem.meetings||[]).includes(mk)) return `<td class="cell-na">—</td>`;
      const a = memData.filter(r=>r.type===mk&&r.status==='attend').length;
      const l = memData.filter(r=>r.type===mk&&r.status==='late').length;
      const ab= memData.filter(r=>r.type===mk&&r.status==='absent').length;
      if(!a&&!l&&!ab) return `<td><span style="color:var(--muted);font-size:11px;">0</span></td>`;
      return `<td>${a?`<span class="cell-g">${a}✅</span> `:''} ${l?`<span class="cell-y">${l}⏰</span> `:''} ${ab?`<span class="cell-r">${ab}❌</span>`:''}</td>`;
    });
    const total = memData.length;
    const mAttend = memData.filter(r=>r.status==='attend').length;
    const rate = total ? Math.round(mAttend/total*100) : 0;
    const rateColor = rate>=80?'var(--green)':rate>=50?'var(--yellow)':'var(--red)';
    return `<tr>
      <td><strong>${displayName(mem)}</strong><br><span style="font-size:10px;color:var(--muted)">${mem.line||''}</span></td>
      ${cells.join('')}
      <td style="font-family:'IBM Plex Mono',monospace;font-weight:700;color:${rateColor};font-size:13px;">${rate}%</td>
    </tr>`;
  });

  document.getElementById('sum-table-title').textContent = sumView==='week' ? 'สรุปรายคน (สัปดาห์นี้)' : sumView==='meeting' ? 'สรุปรายคน (ต่อประเภทประชุม)' : 'สรุปรายคน (เดือนนี้)';
  document.getElementById('sum-table').innerHTML = `
    <thead><tr>
      <th>ชื่อเล่น</th>
      ${usedMtgs.map(k=>`<th style="color:${MTG[k].color}">${MTG[k].label}</th>`).join('')}
      <th>% เข้า</th>
    </tr></thead>
    <tbody>${rows.length?rows.join(''):'<tr><td colspan="'+(usedMtgs.length+2)+'" style="text-align:center;padding:20px;color:var(--muted)">ยังไม่มีข้อมูล</td></tr>'}</tbody>
  `;

  // Detail records
  if(!data.length){
    document.getElementById('sum-records').innerHTML='<div class="empty"><div class="empty-ico">📊</div><p>ไม่มีข้อมูลในช่วงนี้</p></div>';
    return;
  }
  document.getElementById('sum-records').innerHTML = `
    <table><thead><tr>
      <th>สมาชิก</th><th>สายงาน</th><th>ประเภท</th><th>วันที่</th><th>สถานะ</th><th>กล้อง</th><th>หมายเหตุ</th>
    </tr></thead>
    <tbody>${data.map(r=>`<tr>
      <td><strong>${displayName(r.memberName, members.find(x=>x.id===r.memberId)?.uplineId)}</strong></td>
      <td style="color:var(--muted);font-size:12px">${r.memberLine||'—'}</td>
      <td><span style="color:${MTG[r.type]?.color||'var(--muted)'};font-size:12px;font-weight:600">${MTG[r.type]?.label||r.type}</span></td>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${fmtDate(r.date)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${camBadge(r.cam)}</td>
      <td style="font-size:12px;color:var(--muted)">${r.note||'—'}</td>
    </tr>`).join('')}</tbody></table>`;
}

function renderMembers() {
  const g = document.getElementById('member-grid');
  if(!g) return;
  if(!members.length){ g.innerHTML='<div class="empty"><div class="empty-ico">👤</div><p>ยังไม่มีสมาชิก</p></div>'; return; }
  g.innerHTML = members.map(m=>{
    const upline = members.find(x=>x.id===m.uplineId);

    return `<div class="member-card">
      <div class="mc-name">${displayName(m)}</div>
      <div class="mc-sub">สายงาน: ${m.line||'—'}${upline?' · Upline: '+upline.name:''}</div>
      <div class="mc-tags">${tags||'<span style="font-size:11px;color:var(--muted)">ยังไม่กำหนดประชุม</span>'}</div>
      <div class="mc-actions">
        <button class="btn btn-ghost btn-xs" onclick="openMModal(${m.id})">✏️ แก้ไข</button>
        <button class="btn btn-danger btn-xs" onclick="delMember(${m.id})">ลบ</button>
      </div>
    </div>`;
  }).join('');
}

function openMModal(id) {
  editMId = id||null;
  document.getElementById('mmodal-title').textContent = id?'แก้ไขสมาชิก':'เพิ่มสมาชิก';
  // Upline select
  const uSel = document.getElementById('m-upline');
  uSel.innerHTML = '<option value="">— ไม่มี (Root) —</option>';
  members.filter(m=>m.id!==id).forEach(m=>{
    const o=document.createElement('option');o.value=m.id;o.textContent=m.name+(m.line?' ('+m.line+')':'');uSel.appendChild(o);
  });
  // Meeting checkboxes
  document.getElementById('m-mtg-checks').innerHTML = MTG_KEYS.map(k=>`
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted2);">
      <input type="checkbox" class="m-cb" value="${k}" style="accent-color:${MTG[k].color}"/>
      <span style="color:${MTG[k].color};font-weight:600">${MTG[k].label}</span>
      <span style="font-size:11px;color:var(--muted)">${MTG[k].sub}</span>
    </label>`).join('');
  // Fill values
  document.getElementById('m-name').value='';
  document.getElementById('m-line').value='';
  uSel.value='';
  if(id) {
    const mem = members.find(m=>m.id===id);
    if(mem){
      document.getElementById('m-name').value=mem.name;
      document.getElementById('m-line').value=mem.line||'';
      uSel.value=mem.uplineId||'';
      (mem.meetings||[]).forEach(mk=>{
        const cb=document.querySelector(`.m-cb[value="${mk}"]`);
        if(cb)cb.checked=true;
      });
    }
  }
  document.getElementById('modal-m').classList.add('show');
}

function closeMModal(){ document.getElementById('modal-m').classList.remove('show'); editMId=null; }

function saveMember(){
  const name=document.getElementById('m-name').value.trim();
  if(!name) return toast('กรุณากรอกชื่อ','err');
  const line=document.getElementById('m-line').value.trim();
  const uplineId=+document.getElementById('m-upline').value||null;
  const meetings=[...document.querySelectorAll('.m-cb:checked')].map(c=>c.value);
  if(editMId){ const i=members.findIndex(m=>m.id===editMId); if(i>-1)members[i]={...members[i],name,line,uplineId,meetings}; }
  else members.push({id:Date.now(),name,line,uplineId,meetings});
  save(); closeMModal(); renderMembers();
  toast(editMId?'✅ แก้ไขแล้ว':'✅ เพิ่มสมาชิกแล้ว');
}

function delMember(id){
  if(!confirm('ลบสมาชิกนี้?')) return;
  members=members.filter(m=>m.id!==id);
  save(); renderMembers();
  toast('ลบแล้ว','err');
}

function renderOrg(){
  const c=document.getElementById('org-wrap');
  if(!members.length){c.innerHTML='<div class="empty"><div class="empty-ico">🌳</div><p>ยังไม่มีสมาชิก</p></div>';return;}
  const roots=members.filter(m=>!m.uplineId);
  function buildNode(m,depth=0){
    const children=members.filter(x=>x.uplineId===m.id);
    const node=`<div class="org-node${depth===0?' root-node':''}">
      <div class="nn">${displayName(m)}</div>
      <div class="ns">${m.line||''}</div>
    </div>`;
    if(!children.length) return `<div class="org-child">${node}</div>`;
    return `<div class="org-child">
      ${node}
      <div class="org-connector-v"></div>
      <div class="org-children-wrap">
        ${children.map(ch=>buildNode(ch,depth+1)).join('')}
      </div>
    </div>`;
  }
  c.innerHTML=`<div style="display:flex;gap:40px;flex-wrap:wrap;">${roots.map(r=>buildNode(r)).join('')}</div>`;
}

//  MOCK DATA
// ============================================================
function loadMockData(){
  if(!confirm('โหลด Mock Data? (จะลบข้อมูลเดิมทั้งหมด)')) return;
  const M=[
    {id:1001,name:'Deniel',line:'สาย A',uplineId:null,meetings:['begin-online','bridge-online','center-bkk','begin-onsite']},
    {id:1002,name:'Gotji', line:'สาย A',uplineId:1001,meetings:['begin-online','center-bkk','begin-onsite']},
    {id:1003,name:'Get',   line:'สาย A',uplineId:1001,meetings:['begin-online','bridge-online','begin-onsite']},
    {id:1004,name:'แพร',  line:'สาย B',uplineId:1001,meetings:['bridge-online','center-bkk','center-korat']},
    {id:1005,name:'กิ๊ก', line:'สาย B',uplineId:1004,meetings:['begin-online','center-bkk']},
    {id:1006,name:'นุ้ย', line:'สาย C',uplineId:1001,meetings:['center-bkk','begin-onsite','center-korat']},
    {id:1007,name:'เบียร์',line:'สาย C',uplineId:1006,meetings:['begin-online','center-korat']},
  ];
  const SCHED=[
    {type:'begin-online',dow:1},{type:'bridge-online',dow:1},
    {type:'center-korat',dow:4},{type:'center-bkk',dow:5},{type:'begin-onsite',dow:0},
  ];
  function rs(){const r=Math.random()*100;return r<13?'absent':r<28?'late':'attend';}
  const recs=[];
  const now=new Date();
  for(let mo=0;mo<=1;mo++){
    let tm=now.getMonth()-mo,ty=now.getFullYear();
    if(tm<0){tm+=12;ty--;}
    const dim=new Date(ty,tm+1,0).getDate();
    SCHED.forEach(sch=>{
      for(let d=1;d<=dim;d++){
        if(new Date(ty,tm,d).getDay()!==sch.dow) continue;
        if(new Date(ty,tm,d)>now) continue;
        const ds=ty+'-'+String(tm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const isOnline=['begin-online','bridge-online'].includes(sch.type);
        M.forEach(mem=>{
          if(!(mem.meetings||[]).includes(sch.type)) return;
          const status=rs();
          const notes=['','','ติดงาน','ลูกป่วย','ติดนัดหมาย',''];
          recs.push({
            id:Date.now()+Math.floor(Math.random()*9999999),
            memberId:mem.id,memberName:mem.name,memberLine:mem.line,
            type:sch.type,date:ds,status,
            cam:isOnline?(status==='absent'?'na':Math.random()>0.3?'on':'off'):'na',
            note:status==='absent'?notes[Math.floor(Math.random()*notes.length)]:'',
            savedAt:new Date().toISOString()
          });
        });
      }
    });
  }
  recs.sort((a,b)=>b.date.localeCompare(a.date));
  members=JSON.parse(JSON.stringify(M));
  records=JSON.parse(JSON.stringify(recs));
  save();
  buildMtgSelector();
  renderMembers();
  toast('🎲 โหลด Mock Data สำเร็จ! '+members.length+' คน / '+records.length+' records');
}

function clearAll(){
  if(!confirm('ล้างข้อมูลทั้งหมด?')) return;
  members=[];records=[];save();
  renderMembers();
  document.getElementById('checkin-section').style.display='none';
  toast('🗑 ล้างข้อมูลแล้ว','err');
}

// ============================================================
//  HELPERS
// ============================================================
function displayName(m, uplineId) {
  const name = typeof m === 'object' ? m.name : m;
  const uid  = typeof m === 'object' ? m.uplineId : uplineId;
  const u = members.find(x=>x.id===uid);
  return u ? name+' <span style="font-size:11px;font-weight:400;color:var(--muted)">('+u.name+')</span>' : name;
}

function save(){
  localStorage.setItem('dt-members',JSON.stringify(members));
  localStorage.setItem('dt-records',JSON.stringify(records));
}
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(!d)return'—'; const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`; }
function statusBadge(s){
  if(s==='attend') return'<span class="badge b-attend">✅ เข้าร่วม</span>';
  if(s==='late')   return'<span class="badge b-late">⏰ สาย</span>';
  if(s==='absent') return'<span class="badge b-absent">❌ ขาด</span>';
  return'—';
}
function camBadge(c){
  if(c==='on')  return'<span class="badge b-cam-on">📹 เปิด</span>';
  if(c==='off') return'<span class="badge b-cam-off">🚫 ปิด</span>';
  return'<span style="color:var(--muted);font-size:11px">—</span>';
}
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(type==='err'?' err':type==='warn'?' warn':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function exportCSV(){
  if(!records.length) return toast('ยังไม่มีข้อมูล','err');
  const header=['ชื่อเล่น','สายงาน','ประเภทประชุม','วันที่','สถานะ','กล้อง','หมายเหตุ'];
  const sm={attend:'เข้าร่วม',late:'สาย',absent:'ขาด'};
  const cm={on:'เปิดกล้อง',off:'ปิดกล้อง',na:'—'};
  const rows=records.map(r=>[
    r.memberName,r.memberLine||'',MTG[r.type]?.label||r.type,r.date,
    sm[r.status]||r.status,cm[r.cam]||r.cam,r.note||''
  ].map(v=>`"${v}"`).join(','));
  const csv='\uFEFF'+[header.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`attendance-${todayStr()}.csv`;a.click();
  toast('⬇️ Export สำเร็จ!');
}

style.textContent='.active-btn{opacity:1!important;filter:brightness(1.2);box-shadow:0 0 0 2px currentColor!important;}';
document.head.appendChild(style);
</script>
