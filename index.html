<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deniel's Team — Attendance</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#0d0f1a;--surface:#13162a;--surface2:#1a1e35;--card:#161929;
  --border:#252a45;--border2:#2e3555;
  --accent:#7c6dfa;--accent2:#a78bfa;--accent-glow:rgba(124,109,250,0.18);
  --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--blue:#38bdf8;--pink:#f472b6;
  --text:#e2e8f0;--muted:#64748b;--muted2:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:15px;min-height:100vh;}
header{background:linear-gradient(135deg,#13162a,#0d0f1a);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
header h1{font-size:16px;font-weight:600;}
.hdr-actions{margin-left:auto;display:flex;gap:8px;}
.nav{display:flex;border-bottom:1px solid var(--border);background:var(--surface);padding:0 24px;overflow-x:auto;}
.nav::-webkit-scrollbar{height:2px;}
.tab{padding:12px 18px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'Sarabun',sans-serif;white-space:nowrap;transition:all .2s;}
.tab:hover{color:var(--muted2);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);}
.page{display:none;padding:20px 24px;max-width:1100px;}
#page-org{max-width:100%;padding:16px;}
.page.active{display:block;}
.btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Sarabun',sans-serif;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(124,109,250,.3);}
.btn-primary:hover{background:#8b7efb;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:var(--red);}
.btn-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:var(--green);}
.btn-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--yellow);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:5px;}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 13px;color:var(--text);font-size:14px;font-family:'Sarabun',sans-serif;outline:none;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
label.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:5px;}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.b-attend{background:rgba(34,197,94,.12);color:var(--green);}
.b-late{background:rgba(245,158,11,.12);color:var(--yellow);}
.b-absent{background:rgba(239,68,68,.12);color:var(--red);}
.b-cam-on{background:rgba(56,189,248,.12);color:var(--blue);}
.b-cam-off{background:rgba(100,116,139,.12);color:var(--muted2);}
.b-purple{background:rgba(124,109,250,.12);color:var(--accent2);}
.b-none{background:var(--surface2);color:var(--muted);border:1px dashed var(--border2);}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
.stat-val{font-size:24px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.c-g{color:var(--green);} .c-y{color:var(--yellow);} .c-r{color:var(--red);} .c-b{color:var(--blue);} .c-p{color:var(--accent2);}
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
td{padding:9px 14px;font-size:13px;border-bottom:1px solid rgba(37,42,69,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(124,109,250,.04);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translateY(70px);opacity:0;transition:all .3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.err{border-color:var(--red);color:var(--red);}
.toast.warn{border-color:var(--yellow);color:var(--yellow);}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-ico{font-size:34px;margin-bottom:10px;opacity:.3;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.checkin-header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
.mtg-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px;}
.mtg-btn{background:var(--surface2);border:1.5px solid var(--border2);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;transition:all .2s;font-family:'Sarabun',sans-serif;}
.mtg-btn:hover{border-color:var(--accent);background:rgba(124,109,250,.06);}
.mtg-btn.selected{border-color:var(--accent);background:rgba(124,109,250,.1);box-shadow:0 0 0 1px var(--accent);}
.mtg-btn .mb-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.mtg-btn .mb-sub{font-size:11px;color:var(--muted);}
.mtg-btn .mb-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.date-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.date-row input{flex:0 0 auto;}
.checkin-list{display:flex;flex-direction:column;gap:8px;}
.checkin-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;transition:border-color .2s;}
.checkin-row.
